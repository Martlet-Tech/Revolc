[package]
name = "revolc-bho"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/Martlet-Tech/Revolc"
description = "Explorer BHO that tells Revolc a folder window was created."

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"
