[workspace]
members = ["bho", "common", "theme", "tray"]

[package]
name = "revolc"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/Martlet-Tech/Revolc"
description = "Tabs for Windows Explorer — a native reimplementation of Clover."

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }
notify = "6"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arc-swap = "1"
revolc-common = { path = "common" }
revolc-theme = { path = "theme" }

[profile.release]
lto = true
# Line tables + symbols so the crash reporter can name the function that
# faults (src/crash.rs walks the stack with dbghelp). Costs a PDB next to the
# exe, nothing at run time.
debug = 1
